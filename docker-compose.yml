name: cloud-lab
services:
  backend:
    image: mern-backend:lab03
    build:
      context: ./mern-demo
      dockerfile: server/Dockerfile
    env_file:
      - ./mern-demo/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
    ports:
      - "5000:5000"
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/hello', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped

  frontend:
    image: mern-frontend:lab03
    build:
      context: ./mern-demo/client
      dockerfile: Dockerfile
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "5000"
    ports:
      - "5173:80"
    networks:
      - mern-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  mern-network:
    name: mern-network
