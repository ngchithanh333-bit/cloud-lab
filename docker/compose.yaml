
services:
  backend:
    build:
      context: ../mern-demo
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    env_file:
      - ../mern-demo/.env
    restart: unless-stopped

  frontend:
    build:
      context: ../mern-demo
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
